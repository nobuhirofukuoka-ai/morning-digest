name: Daily Digest Update

on:
  schedule:
    - cron: '0 21 * * *'  # 21:00 UTC = 06:00 JST
  workflow_dispatch:        # 手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.js

      - name: Commit and push digest
        run: |
          git config --global user.name 'Morning Digest Bot'
          git config --global user.email 'bot@morning-digest'
          git add data/digest.json data/digest.js data/archive/ || true
          git diff --cached --quiet || git commit -m "Daily update: $(TZ=Asia/Tokyo date +'%Y/%m/%d')"
          git push
